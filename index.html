<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>رسائل المصنع</title>
<style>
:root{--bg:#f1f5f4;--card:#fff;--ink:#12201e;--mute:#6b7c79;--brand:#0f766e;--brand2:#14b8a6;--line:#e2eae8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#16201f;--ink:#e8f1ef;--mute:#8fa5a1;--line:#233130}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.hide{display:none!important}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 22px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;opacity:.9;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:600;background:var(--brand);color:#fff;width:100%;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.2);width:auto;padding:8px 14px;font-size:14px}
.login{max-width:420px;margin:40px auto;padding:0 18px}
.login .box{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--brand),var(--brand2));margin:0 auto 14px;display:grid;place-items:center;font-size:36px}
h2{text-align:center;margin:0 0 4px}
.sub{text-align:center;color:var(--mute);margin:0 0 18px;font-size:14px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--bg);color:var(--ink)}
.err{color:#dc2626;font-size:14px;min-height:20px;margin:10px 0 0;text-align:center}
.list{padding:16px;max-width:640px;margin:0 auto}
.msg{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);position:relative}
.msg.new{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(20,184,166,.2)}
.msg h3{margin:0 0 6px;font-size:17px}
.msg p{margin:0;white-space:pre-wrap;line-height:1.6}
.msg small{display:block;margin-top:8px;color:var(--mute);font-size:12px}
.dot{position:absolute;top:14px;left:14px;width:10px;height:10px;border-radius:50%;background:var(--brand2)}
.empty{text-align:center;color:var(--mute);padding:50px 0}
.install{margin:12px 16px 0;padding:12px;border-radius:12px;background:var(--card);border:1px dashed var(--brand2);text-align:center;font-size:14px}
.install button{margin-top:8px}
</style>
</head>
<body>

<section id="loginView" class="login hide">
  <div class="box">
    <div class="logo">🏭</div>
    <h2>رسائل المصنع</h2>
    <p class="sub">سجّل دخولك لقراءة رسائلك</p>
    <label>كود الموظف</label>
    <input id="code" inputmode="numeric" autocomplete="username">
    <label>رقم الموبايل</label>
    <input id="phone" type="tel" inputmode="numeric" autocomplete="current-password">
    <p class="err" id="err"></p>
    <button class="btn" id="loginBtn">دخول</button>
  </div>
</section>

<section id="mainView" class="hide">
  <header>
    <div class="top"><h1>رسائلي</h1><button class="btn ghost" id="logoutBtn">خروج</button></div>
    <p id="hello"></p>
  </header>
  <div class="install hide" id="installBox">ثبّت التطبيق على موبايلك<br><button class="btn" id="installBtn">تثبيت</button></div>
  <div class="list" id="list"></div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyC2gLmbGX8umoGdewm3ZfEVacHPUSuFefo",
  authDomain: "afactory-messages.firebaseapp.com",
  projectId: "afactory-messages",
  storageBucket: "afactory-messages.firebasestorage.app",
  messagingSenderId: "500605984674",
  appId: "1:500605984674:web:c5296569b2fd7a3d6c5cfb"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const DOMAIN = "@afactory.app";
const toEn = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();

let unsubs = [], store = new Map(), lastSeen = 0, userCode = "";

$("loginBtn").onclick = async () => {
  $("err").textContent = "";
  const code = toEn($("code").value), phone = toEn($("phone").value);
  if (!code || !phone) { $("err").textContent = "اكتب الكود ورقم الموبايل"; return; }
  $("loginBtn").disabled = true;
  try { await signInWithEmailAndPassword(auth, code + DOMAIN, phone); }
  catch (e) { $("err").textContent = "الكود أو رقم الموبايل غير صحيح"; }
  $("loginBtn").disabled = false;
};
$("logoutBtn").onclick = () => signOut(auth);
[$("code"), $("phone")].forEach(i => i.addEventListener("keydown", e => e.key === "Enter" && $("loginBtn").click()));

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = []; store.clear();
  if (!user) { $("mainView").classList.add("hide"); $("loginView").classList.remove("hide"); return; }
  userCode = user.email.split("@")[0];
  if (userCode === "admin") { location.href = "admin.html"; return; }
  lastSeen = Number(localStorage.getItem("seen_" + userCode) || 0);
  $("hello").textContent = "كود الموظف: " + userCode;
  $("loginView").classList.add("hide"); $("mainView").classList.remove("hide");
  for (const v of ["all", userCode]) {
    unsubs.push(onSnapshot(query(collection(db, "messages"), where("to", "==", v)), snap => {
      snap.docChanges().forEach(c => c.type === "removed" ? store.delete(c.doc.id) : store.set(c.doc.id, c.doc.data()));
      render();
    }, () => { $("list").innerHTML = '<div class="empty">تعذر تحميل الرسائل</div>'; }));
  }
});

function render() {
  const items = [...store.values()].sort((a, b) => (b.createdAt?.toMillis?.() ?? Date.now()) - (a.createdAt?.toMillis?.() ?? Date.now()));
  const list = $("list"); list.innerHTML = "";
  if (!items.length) { list.innerHTML = '<div class="empty">لا توجد رسائل حتى الآن</div>'; return; }
  let newest = lastSeen;
  items.forEach(m => {
    const t = m.createdAt?.toMillis?.() ?? Date.now();
    const isNew = t > lastSeen; if (t > newest) newest = t;
    const d = document.createElement("div"); d.className = "msg" + (isNew ? " new" : "");
    if (isNew) d.appendChild(Object.assign(document.createElement("span"), { className: "dot" }));
    d.appendChild(Object.assign(document.createElement("h3"), { textContent: m.title || "" }));
    d.appendChild(Object.assign(document.createElement("p"), { textContent: m.body || "" }));
    d.appendChild(Object.assign(document.createElement("small"), { textContent: new Date(t).toLocaleString("ar-EG") }));
    list.appendChild(d);
  });
  setTimeout(() => { lastSeen = newest; localStorage.setItem("seen_" + userCode, String(newest)); }, 4000);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let deferred;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("installBox").classList.remove("hide"); });
$("installBtn").onclick = async () => { if (deferred) { deferred.prompt(); deferred = null; $("installBox").classList.add("hide"); } };
</script>
</body>
</html>
