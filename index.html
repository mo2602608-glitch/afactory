<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4e89"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><title>رسائل المصنع</title></head><body>
<section id="lv" class="wrap hide" style="margin-top:12vh">
 <h1 style="margin:0 0 4px">رسائل المصنع</h1><p style="color:var(--mute);margin:0 0 20px">ادخل بكود الموظف ورقم الموبايل</p>
 <div class="panel"><label>كود الموظف</label><input id="code" inputmode="numeric" autocomplete="username">
 <label>رقم الموبايل</label><input id="phone" type="tel" inputmode="numeric" autocomplete="current-password">
 <p class="err" id="err"></p><button class="btn" id="go" style="margin-top:4px">دخول</button></div>
</section>
<section id="mv" class="hide">
 <div class="bar"><div><h1 id="nm"></h1><small id="cd"></small></div><button class="btn out" id="out">خروج</button></div>
 <div class="wrap"><div class="chips" id="chips"></div><div id="list"></div></div>
</section>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,query,where,onSnapshot,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyC2gLmbGX8umoGdewm3ZfEVacHPUSuFefo",authDomain:"afactory-messages.firebaseapp.com",projectId:"afactory-messages",storageBucket:"afactory-messages.firebasestorage.app",messagingSenderId:"500605984674",appId:"1:500605984674:web:c5296569b2fd7a3d6c5cfb"});
const auth=getAuth(app),db=getFirestore(app),$=i=>document.getElementById(i),D="@afactory.app";
const en=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let un=[],msgs=new Map(),reads=new Set(),me="",flt="all";
$("go").onclick=async()=>{$("err").textContent="";const c=en($("code").value),p=en($("phone").value);if(!c||!p){$("err").textContent="اكتب الكود ورقم الموبايل";return}
$("go").disabled=true;try{await signInWithEmailAndPassword(auth,c+D,p)}catch{$("err").textContent="الكود أو رقم الموبايل غير صحيح"}$("go").disabled=false};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{un.forEach(f=>f());un=[];msgs.clear();reads.clear();
 if(!u){$("mv").classList.add("hide");$("lv").classList.remove("hide");return}
 me=u.email.split("@")[0];if(me==="admin"){location.href="admin.html";return}
 $("lv").classList.add("hide");$("mv").classList.remove("hide");$("nm").textContent="رسائلي";$("cd").textContent="كود "+me;
 getDoc(doc(db,"employees",me)).then(s=>{if(s.exists()&&s.data().name)$("nm").textContent="أهلاً، "+s.data().name}).catch(()=>{});
 for(const v of["all",me])un.push(onSnapshot(query(collection(db,"messages"),where("to","==",v)),s=>{s.docChanges().forEach(c=>c.type==="removed"?msgs.delete(c.doc.id):msgs.set(c.doc.id,c.doc.data()));draw()},()=>{$("list").replaceChildren(el("div","empty","تعذر تحميل الرسائل. تأكد من الاتصال وحاول مرة أخرى."))}));
 un.push(onSnapshot(query(collection(db,"reads"),where("code","==",me)),s=>{reads=new Set(s.docs.map(d=>d.data().m));draw()}))});
const T=m=>m.createdAt?.toMillis?.()??Date.now();
function draw(){const all=[...msgs].map(([id,m])=>({id,...m})).sort((a,b)=>T(b)-T(a));
 const un_=all.filter(m=>!reads.has(m.id)),ur=all.filter(m=>m.p===2);
 const defs=[["all","الكل",all.length],["unread","غير مقروء",un_.length],["urgent","عاجل",ur.length]];
 $("chips").replaceChildren(...defs.map(([k,l,n])=>{const b=el("button","chip"+(flt===k?" on":""),l+" "+n);b.onclick=()=>{flt=k;draw()};return b}));
 const items=flt==="unread"?un_:flt==="urgent"?ur:all,L=$("list");L.replaceChildren();
 if(!items.length){L.appendChild(el("div","empty",flt==="all"?"لا توجد رسائل بعد. ستظهر هنا فور وصولها.":"لا توجد رسائل في هذا القسم."));return}
 items.forEach(m=>{const un2=!reads.has(m.id),c=el("div","card p"+(m.p||0)+(un2?" unread":""));c.tabIndex=0;
  const r=el("div","row"),h=el("div","row");h.style.gap="8px";if(un2)h.appendChild(el("span","dot"));h.appendChild(el("h3","",m.title||""));r.appendChild(h);
  if(m.p===2||m.p===1)r.appendChild(el("span","tag p"+m.p,m.p===2?"عاجل":"مهم"));
  c.append(r,el("p","",m.body||""),el("div","meta",new Date(T(m)).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"})));
  c.onclick=()=>{c.classList.toggle("open");if(un2)setDoc(doc(db,"reads",m.id+"_"+me),{m:m.id,code:me,at:serverTimestamp()}).catch(()=>{})};L.appendChild(c)})}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
